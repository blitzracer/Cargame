    <style>
    /* Install Popup */
    .install-popup {
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #28a745, #00ff55);
      color: #fff;

      display: flex;
      align-items: center;

      min-width: 140px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      z-index: 9999;
      cursor: pointer;
      opacity: 0;
      transition: top 0.5s ease, opacity 0.5s ease, transform 0.5s ease;
    }

    /* Show state */
    .install-popup.show {
      top: 20px;
      opacity: 1;
      animation: bounceDown 0.6s;
    }

    /* Close button */
    .install-popup button {
      background: none;
      border: none;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      margin-left: 8px;
    }

    /* Bounce animation */
    @keyframes bounceDown {
      0% { top: -100px; }
      60% { top: 30px; }
      80% { top: 15px; }
      100% { top: 20px; }
    }
    </style>

</head>
<body>

    <!-- Install Popup HTML -->

      <span>Install BlitzRacer</span>
      <button id="closeBtn">&times;</button>
    </a>

    <!-- Install Popup Script -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
      const popup = document.getElementById('installPopup');
      const link = "https://blitzracer.github.io/Cargameapk/";

      if (!localStorage.getItem('installPopupShown')) {
        localStorage.setItem('installPopupShown', 'true');
        popup.classList.add('show');

        // Auto-hide after 5s
        const autoHide = setTimeout(hidePopup, 5000);

        // Close button
        document.getElementById('closeBtn').onclick = (e) => {
          e.stopPropagation();
          clearTimeout(autoHide);
          hidePopup();
        };

        // Click anywhere opens link
        popup.addEventListener('click', () => {
          window.open(link, "_blank", "noopener,noreferrer");
        });

        // Swipe to dismiss
        let startX = 0;
        popup.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        popup.addEventListener('touchmove', e => {
          let moveX = e.touches[0].clientX;
          if (moveX - startX > 50) {
            clearTimeout(autoHide);
            hidePopup();
          }
        });
      }

      function hidePopup() {
        popup.style.top = '-150px';
        popup.style.opacity = '0';
        popup.style.transform = 'translateX(-50%)';
        setTimeout(() => popup.remove(), 500);
      }
    });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('https://blitzracer.vercel.app/service-worker.js', { 
            scope: '/' 
          });
          console.log('ServiceWorker registered:', registration.scope);
        } catch (error) {
          console.error('ServiceWorker registration failed:', error);
        }
      });
    }
    </script>
